[project]
name = "velora"
version = "0.1.0"
description = "CLI that turns EPUB and PDF chapters or page ranges into audio using pluggable TTS models"
readme = "README.md"
authors = [
    { name = "Geri Gian Epanto", email = "epanto.gg@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "ebooklib>=0.20",
    "num2words>=0.5.14",
    "selectolax>=1.0.1",
    "typer>=0.27.3",
]

[project.scripts]
velora = "velora:main"

[build-system]
requires = ["uv_build>=0.13.3,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pre-commit>=4.7.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.1",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF", "PL", "PT"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR2004"]

[tool.mypy]
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=velora --cov-report=term-missing"

[tool.coverage.report]
fail_under = 80

[[tool.mypy.overrides]]
module = ["ebooklib", "ebooklib.*", "num2words"]
ignore_missing_imports = true
